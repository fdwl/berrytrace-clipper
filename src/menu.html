<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<title>莓莓印记</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			:root { color-scheme: light dark; --bg: #fff; --fg: #1f2328; --muted: #6b7280; --hover: #f2f3f5; --err: #c0392b; }
			@media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --fg: #e6e6e6; --muted: #9aa0a6; --hover: #2b2d31; --err: #ff7b72; } }
			html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
			body { width: 260px; padding: 6px; box-sizing: border-box; }
			h1 { margin: 6px 8px 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
			button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 8px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
			button:hover { background: var(--hover); }
			button small { display: block; color: var(--muted); font-size: 11px; }
			svg { flex: none; }
			#note { display: none; margin: 4px 8px 6px; font-size: 12px; color: var(--err); }
		</style>
	</head>
	<body>
		<h1>莓莓印记</h1>
		<button id="m-annotate">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
			<span>标记页面元素<small>点元素写备注，发到客户端输入框</small></span>
		</button>
		<button id="m-agent">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
			<span>Agent 对话框<small>唤出客户端的 mini Agent 小窗</small></span>
		</button>
		<button id="m-clip">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
			<span>提取网页内容<small>剪藏当前页</small></span>
		</button>
		<p id="note"></p>
		<script src="relay-menu.js"></script>
	</body>
</html>
